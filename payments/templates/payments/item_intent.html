<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay {{ item.name }} (Payment Intent)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    #payment-element { margin: 1.5rem 0; }
    button { padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; }
    #message { color: #b00020; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>{{ item.name }}</h1>
  <p>{{ item.description }}</p>
  <p><strong>{{ item.price }} {{ item.currency|upper }}</strong></p>

  <form id="payment-form">
    <div id="payment-element"></div>
    <button id="submit" type="submit">Pay</button>
    <div id="message"></div>
  </form>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe('{{ stripe_public_key }}');
    const message = document.getElementById('message');

    fetch('/buy-intent/{{ item.id }}')
      .then((response) => response.json())
      .then(({ clientSecret }) => {
        const elements = stripe.elements({ clientSecret });
        const paymentElement = elements.create('payment');
        paymentElement.mount('#payment-element');

        document.getElementById('payment-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          message.textContent = '';

          const { error } = await stripe.confirmPayment({
            elements,
            confirmParams: {
              return_url: window.location.origin + '/item-intent/{{ item.id }}?paid=1',
            },
          });

          if (error) {
            message.textContent = error.message;
          }
        });
      })
      .catch(() => {
        message.textContent = 'Failed to initialize payment.';
      });
  </script>
</body>
</html>
